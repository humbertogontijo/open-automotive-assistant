name: "Open Automotive Assistant"
description: "Always-on OAA hub — control paired cars with the same UI as the head unit"
version: "0.1.0"
slug: open_automotive_assistant
url: "https://github.com/humbertogontijo/open-car-assistant"
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8787
panel_icon: mdi:car-connected
panel_title: OAA
# Same multi-arch image as docker compose (deploy/docker/Dockerfile, publish-hub.yml).
image: "ghcr.io/humbertogontijo/open-automotive-assistant"
ports:
  8787/tcp: 8787
  8788/tcp: 8788
ports_description:
  8787/tcp: OAA hub human face (UI + auth)
  8788/tcp: OAA hub node face (car dial-in)
map:
  - type: data
    read_only: false
environment:
  OAA_HOMEASSISTANT_ADDON: "true"
  OAA_PORT: "8787"
  OAA_NODE_PORT: "8788"
# WebRTC media plane (remote Cameras). Leave empty for public STUN only.
options: {}
schema:
  stun_urls: "str?"
  turn_urls: "str?"
  turn_secret: "password?"
  turn_ttl: "int(60,86400)?"
