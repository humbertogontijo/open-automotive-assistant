name: "Open Automotive Assistant"
description: "Always-on OAA hub — control paired cars with the same UI as the head unit"
version: "0.1.10"
slug: open_automotive_assistant
url: "https://github.com/humbertogontijo/open-automotive-assistant"
arch:
  - aarch64
  - amd64
init: false
# After Home Assistant Core: run.sh asks it for its public URL (Nabu Casa / external URL).
startup: application
homeassistant_api: true
ingress: true
ingress_port: 8787
panel_icon: mdi:car-connected
panel_title: OAA
# Same multi-arch image as docker compose (deploy/docker/Dockerfile, publish-hub.yml).
image: "ghcr.io/humbertogontijo/open-automotive-assistant"
# Host networking so the hub sees cars' mDNS announcements (Cars → Nearby cars) and
# reaches the car's LAN API to ask for a pairing code. The ports below stay the same.
host_network: true
ports:
  8787/tcp: 8787
  8788/tcp: 8788
ports_description:
  8787/tcp: OAA hub human face (UI + auth)
  8788/tcp: OAA hub node face (car dial-in)
map:
  - type: data
    read_only: false
  # run.sh keeps the Open Automotive Assistant integration in custom_components (at /homeassistant).
  - type: homeassistant_config
    read_only: false
environment:
  OAA_HOMEASSISTANT_ADDON: "true"
# public_node_url: Home Assistant URL away cars dial (e.g. https://ha.example.com), through the
# integration's /api/oaa_node bridge. Leave empty to use Home Assistant's Nabu Casa URL (else its
# external URL), read at start.
# WebRTC media plane (remote Cameras). Leave empty for public STUN only.
# car_updates: how cars get the car app matching this version (from GitHub Releases): ask shows
# an Install button in the car's Settings, auto installs when the car connects, off announces nothing.
options:
  car_updates: ask
schema:
  car_updates: "list(ask|auto|off)"
  public_node_url: "url?"
  stun_urls: "str?"
  turn_urls: "str?"
  turn_secret: "password?"
  turn_ttl: "int(60,86400)?"
