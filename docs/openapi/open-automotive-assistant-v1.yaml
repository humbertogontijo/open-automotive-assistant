          type: string
          enum: [hello, ping, telemetry, entity, catalog, dvr]
          description: |
            `entity` — atomic value patch (`id`, `value`, `status`);
            `catalog` — reload /api/entities; `telemetry` — session telemetry snapshot
            (at most once per second); `dvr` — DVR summary (mode, storage, usage), sent
