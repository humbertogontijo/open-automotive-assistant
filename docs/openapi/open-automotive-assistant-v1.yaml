openapi: 3.0.3
info:
  title: Open Automotive Assistant Protocol
  description: |
    Versioned HTTP + WebSocket contract for Open Automotive Assistant.
    Host roles: `local` (head unit) and `hub` (always-on fleet server).
    Entity field names follow EntityContract (HA-shaped domain.object_id).
    On a hub, car APIs are the same paths; the car is selected by the
    `X-Oaa-Node` header, then `?node=`, then the `oaa_node` cookie. The hub
    forwards `/api/*` (any signed-in user) and `/debug/*` (admins) to that car
    as `rpc` frames; bodies are binary-safe and capped at 2.5 MiB each way (413).

    Car access (ADR-0004): on `role=local`, every `/api/*` and `/debug/*` call
    needs a caller (head unit session, or a browser / hub / tool paired with a
    code shown on the head unit) and answers 401 otherwise. Open: `/api/health`,
    `/api/i18n` and `/api/auth/status|local|pair/request|pair/confirm`.

    Hub dual faces (ADR-0003): human UI/API on port 8787 (hub session required);
    node dial-in on port 8788 (`/api/nodes/pair`, `/api/nodes/session`,
    `/api/nodes/artifacts/{sha256}` only). Away cars may reach the node face via
    Home Assistant Cloud narrow views (`/api/oaa_node/pair|session|artifacts`).

    Node session frames are `{type, payload}`; see `NodeFrame`. App updates are
    hub-delivered (`/api/ota/*`, `ota_offer` / `ota_status`).

    Two planes (ADR-0003). **Control plane:** this HTTP API, `/api/events`,
    and node session frames (proxied HTTP, events, OTA, logs). **Media
    plane:** WebRTC between the car and the viewer — one H.264 RTP track per
    camera (MediaStream `oaa-cam-<role>`) carrying live video or a DVR replay,
    plus a reliable SCTP data channel (`oaa-media`) for the car clock, camera
    selection, replay control, downloads and cuts. Both the hub (`role=hub`) and the car
    itself (`role=local`) serve `/api/webrtc/signal`; the hub relays signaling
    only and never carries or stores media bytes. Signaling frames and
    data-channel JSON carry `v: 1`; see `WebRtcSignal`, `DataChannelHello`
    and `MediaChunk` below.
  version: 0.1.13
servers:
  - url: http://127.0.0.1:8787
    description: HU GeckoView / localhost (role=local)
  - url: http://{carHost}:8787
    description: Same-LAN browser against a car
    variables:
      carHost:
        default: 192.168.1.1
  - url: http://{hubHost}:8787
    description: Self-hosted OAA hub human face (role=hub; session required)
    variables:
      hubHost:
        default: 192.168.1.10
  - url: http://{hubHost}:8788
    description: Hub node face (pair, session and OTA artifacts only)
    variables:
      hubHost:
        default: 192.168.1.10
security:
  - {}
  - hubSession: []
  - carSession: []
  - bearer: []
paths:
  /api/status:
    get:
      summary: Host status and role
      operationId: getStatus
      parameters:
        - $ref: "#/components/parameters/OaaNodeHeader"
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/entities:
    get:
      summary: List product entities
      operationId: listEntities
      parameters:
        - name: includeHidden
          in: query
          schema:
            type: string
            enum: ["1"]
          description: When `1`, include entities marked hidden by the user
        - $ref: "#/components/parameters/OaaNodeHeader"
      responses:
        "200":
          description: Entity catalog snapshot (JSON array of Entity maps)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
  /api/events:
    get:
      summary: WebSocket event stream (upgrade)
      description: |
        Clients connect with `Upgrade: websocket`. Frames are `EventEnvelope` JSON objects.
        On a hub, pass `X-Oaa-Node` (or `?node=`) to subscribe to one car's events.
      operationId: eventsWebSocket
      parameters:
        - $ref: "#/components/parameters/OaaNodeHeader"
        - name: node
          in: query
          schema:
            type: string
          description: Alternate to X-Oaa-Node for WebSocket clients
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "200":
          description: Documentation stub — live clients must use WebSocket
  /api/nodes:
    get:
      summary: List fleet nodes (hub only)
      operationId: listNodes
      responses:
        "200":
          description: Fleet snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fleet"
        "404":
          description: Not a hub (`role` is local)
  /api/nodes/pairing:
    post:
      summary: Create a short-lived pairing code (hub only)
      operationId: createPairingCode
      responses:
        "200":
          description: Pairing offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingOffer"
  /api/nodes/pair:
    post:
      summary: Complete pairing from a car node (hub only)
      operationId: pairNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Paired node credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          description: Invalid or expired code
  /api/nodes/discovered:
    get:
      summary: Unpaired cars announcing `_oaa-car._tcp` (hub only, admin)
      operationId: listDiscoveredCars
      responses:
        "200":
          description: Cars seen by mDNS that are not paired to this hub
          content:
            application/json:
              schema:
                type: object
                properties:
                  cars:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveredCar"
  /api/nodes/invite:
    post:
      summary: Ask a car for a pairing code (hub only, admin)
      description: |
        The hub calls the car's `/api/auth/pair/request` with `kind=hub`. The car
        shows a 6-digit code on its head unit; the admin types it into
        `/api/nodes/invite/{id}/confirm`.
      operationId: inviteCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarInviteRequest"
      responses:
        "200":
          description: Invite open on the car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarInvite"
        "429":
          description: The car already has an open request from this hub
        "502":
          description: Car unreachable
  /api/nodes/invite/{inviteId}/confirm:
    post:
      summary: Send the code shown on the car (hub only, admin)
      description: |
        The hub pre-registers a node token and sends it with the code in the
        car's `/api/auth/pair/confirm` (`hub` object). On success the car dials
        the node face; the hub keeps the car-issued token and LAN URL.
      operationId: confirmCarInvite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  node:
                    $ref: "#/components/schemas/NodeSummary"
        "403":
          description: Wrong code
        "404":
          description: Invite or car request expired
  /api/nodes/invite/{inviteId}:
    delete:
      summary: Forget an open invite (hub only, admin)
      operationId: cancelCarInvite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
  /api/auth/status:
    get:
      summary: Caller identity (car and hub)
      description: |
        On a car (`role=local`): whether this caller is trusted, its kind and
        whether it is the head unit. Hubs answer their session state.
      operationId: authStatus
      responses:
        "200":
          description: Auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarAuthStatus"
  /api/auth/local:
    post:
      summary: Check the head unit session (local only)
      operationId: authLocal
      responses:
        "200":
          description: The caller is the head unit
        "401":
          description: Not the head unit
  /api/auth/pair/request:
    post:
      summary: Ask the car to show a pairing code (local only)
      description: |
        6-digit code, 3-minute TTL, 5 attempts, one open request per source
        address, at most 5 open. The code is shown only on the head unit
        (dialog + notification).
      operationId: carPairRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarPairRequest"
      responses:
        "200":
          description: Request open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarPairRequestResponse"
        "429":
          description: Too many open requests, or one already open from this address
  /api/auth/pair/confirm:
    post:
      summary: Confirm with the code shown on the car (local only)
      description: |
        Must come from the address that asked. Browsers receive the `oaa_car`
        cookie; hubs and tools receive `token` in the body. `kind=hub` requests
        must carry `hub`, which the car stores as its hub link.
      operationId: carPairConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarPairConfirm"
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: string
                    description: Car-issued bearer token (hub and tool only)
                  clientId:
                    type: string
                  nodeId:
                    type: string
        "403":
          description: Wrong code, or confirm from another address
        "404":
          description: Unknown or expired request
  /api/auth/pair/pending:
    get:
      summary: Open pairing requests with their codes (head unit only)
      operationId: carPairPending
      responses:
        "200":
          description: Open requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      $ref: "#/components/schemas/CarPairPending"
  /api/auth/pair/pending/{id}:
    delete:
      summary: Decline a pairing request (head unit only)
      operationId: carPairDecline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Declined
  /api/auth/clients:
    get:
      summary: Trusted devices (head unit only)
      operationId: carClients
      responses:
        "200":
          description: Paired browsers, hubs and tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/CarClient"
  /api/auth/clients/{id}:
    delete:
      summary: Revoke a trusted device (head unit only)
      description: Revoking a hub also drops the car's hub link.
      operationId: carClientRevoke
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
        "404":
          description: Unknown client
  /api/nodes/{nodeId}:
    delete:
      summary: Disconnect / forget a node (hub only)
      operationId: removeNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/nodes/session:
    get:
      summary: Node outbound WebSocket session (hub only)
      description: |
        Cars connect with `Upgrade: websocket` and authenticate with
        `Authorization: Bearer <nodeToken>` (or query `token=`). Frames are
        `NodeFrame` JSON. Car→hub: `hello`, `event`, `rpc_result`,
        `ota_status`, `log`, `pong`, WebRTC answers/ICE. Hub→car: `rpc`,
        `ota_offer`, `public_node` (on connect and on change), `log_subscribe`,
        `log_unsubscribe`, `ping`, WebRTC offers/ICE/hangup.
      operationId: nodeSessionWebSocket
      responses:
        "101":
          description: Switching Protocols
  /api/nodes/artifacts/{sha256}:
    get:
      summary: Download an OTA artifact (hub node face; node token)
      description: |
        Served on the node face only, with `Authorization: Bearer <nodeToken>`
        (or `?token=`). Supports `Range` so cars resume interrupted downloads.
        The `ota_offer` frame carries the path to use, which may be the
        HA Cloud bridge (`/api/oaa_node/artifacts/{sha256}`). The same path
        serves delta patches (`ota_offer.delta.path`), addressed by the
        patch's own SHA-256.
      operationId: downloadArtifact
      parameters:
        - $ref: "#/components/parameters/Sha256Path"
      responses:
        "200":
          description: APK bytes, or an OADP patch for a delta
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
            application/vnd.oaa.apk-delta:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content for a `Range` request
        "401":
          description: Missing or invalid node token
        "404":
          description: Unknown artifact
  /api/ota/artifacts:
    post:
      summary: Upload an APK for OTA (hub; admin)
      operationId: uploadArtifact
      parameters:
        - name: X-Oaa-Package
          in: header
          required: true
          schema:
            type: string
        - name: X-Oaa-Version-Name
          in: header
          schema:
            type: string
        - name: X-Oaa-Version-Code
          in: header
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/vnd.android.package-archive:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored (content-addressed; re-uploads are idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  artifact:
                    $ref: "#/components/schemas/Artifact"
        "413":
          description: Over 256 MiB
    get:
      summary: List stored artifacts, newest first (hub; admin)
      operationId: listArtifacts
      responses:
        "200":
          description: Artifacts (the hub keeps the last 5)
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
  /api/ota/rollouts:
    post:
      summary: Roll an artifact out to cars (hub; admin)
      description: |
        Online targets get `ota_offer` immediately; offline ones when they
        reconnect. A target becomes `installed` only when the car's `hello`
        reports the artifact's APK hash.
      operationId: createRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact]
              properties:
                artifact:
                  type: string
                  description: Artifact sha256
                nodes:
                  type: array
                  items:
                    type: string
                all:
                  type: boolean
                  description: Target every paired car instead of `nodes`
      responses:
        "200":
          description: Rollout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  rollout:
                    $ref: "#/components/schemas/Rollout"
        "400":
          description: Missing targets or unknown nodes
        "404":
          description: Unknown artifact
    get:
      summary: List rollouts (hub; admin)
      operationId: listRollouts
      responses:
        "200":
          description: Rollouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rollout"
  /api/ota/rollouts/{id}:
    get:
      summary: One rollout with per-car state (hub; admin)
      operationId: getRollout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rollout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollout"
        "404":
          description: Unknown rollout
  /debug/logs/stream:
    get:
      summary: Live app log stream (WebSocket)
      description: |
        Text frames, one log line each (recent backlog first). On a car the
        contributor `token` is required. On a hub (admins only, car chosen by
        `?node=`), the hub sends `log_subscribe {token}` to the car and relays
        its `log` frames while at least one viewer is attached. Other
        `/debug/*` routes are proxied as regular `rpc` requests.
      operationId: debugLogStream
      parameters:
        - name: token
          in: query
          schema:
            type: string
        - name: node
          in: query
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
  /api/webrtc/ice:
    get:
      summary: ICE servers for the media plane (human face; session required)
      description: |
        Hub: returns STUN URLs and, when `OAA_TURN_URLS` + `OAA_TURN_SECRET` are set,
        short-lived TURN credentials in the coturn REST format
        (`username = <unixExpiry>:<userId>`, `credential = base64(HMAC-SHA1(secret, username))`).
        The shared secret never leaves the hub. The hub injects its own
        `iceServers` into the offer it relays to the car.

        Car (`role=local`, car auth): returns no servers (`iceServers: []`,
        `turn: false`); LAN and loopback viewers need none.
      operationId: getIceServers
      responses:
        "200":
          description: ICE configuration for RTCPeerConnection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IceConfig"
        "401":
          description: Hub session required
  /api/webrtc/signal:
    get:
      summary: WebRTC signaling WebSocket (human face; session required)
      description: |
        `Upgrade: websocket`. On the hub it is scoped to one car with
        `?node=<nodeId>` (or `X-Oaa-Node`). The hub binds this socket to the
        node's session by `sessionId` and relays `webrtc_offer` / `webrtc_ice` /
        `webrtc_hangup` to the car over the existing node WebSocket;
        `webrtc_answer` / `webrtc_ice` / `webrtc_hangup` come back. SDP is never
        inspected or persisted.

        On the car (`role=local`, car auth) there is no `node` parameter: the
        car answers the same frames itself after a `hello {v, role: "local",
        online: true}`.

        Limits (v1): one hub WebRTC session per node and up to three local
        sessions on the car — a newer offer replaces the oldest
        (`reason=replaced`); at most 128 relayed ICE candidates per session per
        direction; frames ≤ 64 KiB. Any frame whose `v` differs from 1 is
        answered with `webrtc_hangup` `reason=version`. Offline node →
        `reason=offline`; node without WebRTC support → `reason=unsupported`.

        Access (v1): any authenticated hub user may open a session to any
        paired node; per-node ACLs are future work.
      operationId: webrtcSignalWebSocket
      parameters:
        - name: node
          in: query
          required: false
          description: Hub only (required there)
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols. Frames are `WebRtcSignal` JSON.
  /api/hub:
    get:
      summary: Hub join config on a local node (local only)
      operationId: getHubConfig
      responses:
        "200":
          description: Current hub pairing state on this car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubJoinConfig"
    post:
      summary: Join or update hub pairing on a local node
      operationId: setHubConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubJoinRequest"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubJoinConfig"
    delete:
      summary: Leave hub (local only)
      operationId: leaveHub
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/update:
    get:
      summary: App update announced by the hub (car)
      description: |
        The hub sends `ota_available` after every `hello`: its policy (`ask`, `auto`,
        `off`) and, when it holds a newer build of this car's package, that build.
      operationId: getAppUpdate
      responses:
        "200":
          description: Update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdate"
    post:
      summary: Install the announced build (car; head unit only)
      description: |
        Sends `ota_request` to the hub, which answers with `ota_offer` (a delta from
        the installed APK when it has or can fetch that build).
      operationId: installAppUpdate
      responses:
        "200":
          description: Requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdate"
        "403":
          description: Not the head unit
        "409":
          description: No update announced, or the hub is offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdate"
components:
  securitySchemes:
    hubSession:
      type: apiKey
      in: cookie
      name: oaa_session
      description: Hub login session (human face)
    carSession:
      type: apiKey
      in: cookie
      name: oaa_car
      description: Car session (head unit) or paired-browser token (ADR-0004)
    bearer:
      type: http
      scheme: bearer
      description: |
        Hub session / system token on the human face, node token on the node
        face, or a car-issued hub / tool token on a car
  parameters:
    OaaNodeHeader:
      name: X-Oaa-Node
      in: header
      required: false
      schema:
        type: string
      description: On hub hosts, select which paired car to address (else `?node=`, else the `oaa_node` cookie)
    Sha256Path:
      name: sha256
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
  schemas:
    Status:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [local, hub]
        nodeId:
          type: string
          nullable: true
          description: This host's node id when role=local
        fleet:
          $ref: "#/components/schemas/Fleet"
        remote:
          type: boolean
          description: False only for the head unit UI (local session); true for paired devices and the hub
        webPort:
          type: integer
        integration:
          type: string
        variant:
          type: string
        capabilities:
          type: array
          items:
            type: string
        pages:
          type: array
          description: SPA page ids this car serves (`role=local`). Absent on older cars.
          items:
            type: string
        theme:
          type: string
        webrtc:
          type: object
          description: Present on hubs that relay the media plane (ADR-0003)
          properties:
            v:
              type: integer
            turn:
              type: boolean
    Fleet:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeSummary"
        publicNode:
          type: object
          description: The public node endpoint the hub hands cars (`OAA_PUBLIC_NODE_URL`; all null when unset)
          properties:
            url:
              type: string
              nullable: true
            dialUrl:
              type: string
              nullable: true
              description: What to type on a car for manual pairing (url plus any bridge prefix)
            check:
              type: object
              nullable: true
              description: Whether the URL leads back to this hub (null until the first check finishes)
              required: [ok, checkedAtMs]
              properties:
                ok:
                  type: boolean
                detail:
                  type: string
                  nullable: true
                  description: Why it failed (HTTP status and error, or the connection error)
                checkedAtMs:
                  type: integer
                  format: int64
        carRelease:
          $ref: "#/components/schemas/CarRelease"
    CarRelease:
      type: object
      description: |
        The car app built for this hub's version, fetched from its release folder
        (`OAA_CAR_RELEASE_URL`, GitHub Releases by default) and announced to older cars
        with `ota_available`. `mode` is the `car_updates` option (`OAA_CAR_UPDATES`).
      required: [mode, state, url]
      properties:
        mode:
          type: string
          enum: [ask, auto, "off"]
        state:
          type: string
          enum: [ready, fetching, unavailable, "off"]
        versionName:
          type: string
          nullable: true
        versionCode:
          type: integer
          format: int64
          nullable: true
        url:
          type: string
