        body:
          type: string
        bodyB64:
          type: string
          format: byte
    OtaOffer:
      type: object
      required: [v, rolloutId, sha256, path]
      properties:
        v:
          type: integer
          enum: [1]
        rolloutId:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
        package:
          type: string
        versionName:
          type: string
          nullable: true
        versionCode:
          type: integer
          format: int64
          nullable: true
        path:
          type: string
          description: Download path relative to the car's node URL
        delta:
          type: object
          description: |
            Present when the car's reported APK (`hello.app.apkSha256`) is a stored
            artifact. The car rebuilds the target from its installed APK plus this
            OADP patch, checks the result against `sha256`, and falls back to `path`
            on any failure.
          required: [from, sha256, size, path]
          properties:
            from:
              type: string
              description: SHA-256 of the installed APK the patch applies to
            sha256:
              type: string
              description: SHA-256 of the patch file
            size:
              type: integer
              format: int64
            path:
              type: string
              description: Patch download path relative to the car's node URL
    OtaStatus:
      type: object
      required: [v, rolloutId, state]
