    NodeFrame:
      type: object
      required: [type]
      description: |
        Frame on `/api/nodes/session`. Payload shapes: `hello` → `NodeHello`,
        `event` → `EventEnvelope`, `rpc` → `RpcRequest`, `rpc_result` →
        `RpcResult`, `ota_offer` → `OtaOffer`, `ota_status` → `OtaStatus`,
        `log_subscribe` → `{v, token?}`, `log` → `{line}`, `public_node` →
        `{v, publicNodeUrl?, sessionPath}`; WebRTC frames are
        `WebRtcSignal`. `ping` / `pong` / `log_unsubscribe` carry no payload.
      properties:
        type:
          type: string
          enum:
            - hello
            - event
            - ping
            - pong
            - rpc
            - rpc_result
            - ota_offer
            - ota_status
            - public_node
            - log_subscribe
            - log_unsubscribe
            - log
            - webrtc_offer
            - webrtc_answer
            - webrtc_ice
            - webrtc_hangup
        payload:
          type: object
          additionalProperties: true
    NodeHello:
      type: object
      required: [v, nodeId]
      properties:
        v:
          type: integer
          enum: [1]
        nodeId:
          type: string
        name:
          type: string
        integration:
          type: string
        version:
          type: string
          description: Protocol / app version (0.1.0)
        app:
