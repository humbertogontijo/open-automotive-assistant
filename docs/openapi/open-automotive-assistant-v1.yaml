              state:
                $ref: "#/components/schemas/OtaState"
              progress:
                type: integer
                nullable: true
              error:
                type: string
                nullable: true
              updatedAtMs:
                type: integer
                format: int64
    IceConfig:
      type: object
      required: [v, iceServers]
      properties:
        v:
          type: integer
          enum: [1]
        iceServers:
          type: array
          items:
            type: object
            required: [urls]
            properties:
              urls:
                type: array
                items:
                  type: string
              username:
                type: string
              credential:
                type: string
        ttlSec:
          type: integer
          description: Lifetime of the TURN credential
        turn:
          type: boolean
          description: True when TURN relay credentials are included
    WebRtcSignal:
      type: object
      required: [type, payload]
      description: |
        Signaling envelope on `/api/webrtc/signal` and on the node session.
        Directions: `webrtc_offer` viewer→car; `webrtc_answer` car→viewer;
        `webrtc_ice` and `webrtc_hangup` both ways. The viewer creates the
        offer (up to four recvonly H.264 video m-lines + the `oaa-media` data
        channel); the car fills one m-line per camera, each track in the
        MediaStream `oaa-cam-<role>`, and leaves the rest inactive.
      properties:
        type:
          type: string
          enum: [webrtc_offer, webrtc_answer, webrtc_ice, webrtc_hangup]
        payload:
          type: object
          required: [v, sessionId]
          properties:
            v:
              type: integer
              enum: [1]
            sessionId:
              type: string
              pattern: "^[A-Za-z0-9_-]{8,64}$"
            sdp:
              type: string
              description: offer / answer only
            codecs:
              type: array
              items:
                type: string
              description: answer only — negotiated codecs (e.g. `H264`)
            tracks:
              type: array
              items:
                type: string
              description: answer only — camera roles with a video track, in m-line order
            candidate:
              type: string
            sdpMid:
              type: string
              nullable: true
            sdpMLineIndex:
              type: integer
              nullable: true
            iceServers:
              type: array
              items:
                type: object
              description: Added by the hub to the offer it forwards to the car
            reason:
              type: string
              enum: [version, busy, replaced, offline, unsupported, bye, invalid, error]
              description: hangup only
    DataChannelHello:
      type: object
      required: [type, v, sessionId, features]
      description: |
        First message the car sends on the `oaa-media` data channel (reliable,
        ordered). The viewer must only use features listed here.

        Viewer→car JSON messages (all with `v: 1`; transfers carry a numeric `reqId`):
        `download_open {reqId, name}` (basename only — `/`, `\`, `..` rejected),
        `cut_request {reqId, role, fromMs, toMs}` (one camera, ≤ `maxCutMs`; the
        car re-encodes the range with the time burned in), `transfer_cancel {reqId}`.
        Without `reqId`: `live_select {roles?}` (cameras to send, live or
        replayed; omitted = all), `live_pause` / `live_resume` (stop/start
        sending live video frames, e.g. while the viewer tab is hidden — resume
        starts on a key frame), `clock_sync {t0}` (viewer clock ms), and with
        the `replay` feature `replay_start {atMs, speed?, paused?}` (send the
        recordings from wall time `atMs` on the camera tracks instead of live;
        a gap snaps to the next recording), `replay_seek {atMs}`,
        `replay_pause`, `replay_resume`, `replay_speed {speed}` (0.25–4) and
        `replay_stop` (back to live).

        Car→viewer JSON: `media_meta {reqId, kind, name?, mime, size?,
        durationMs?}` precedes the bytes of each transfer; `media_progress
        {reqId, doneMs, totalMs}` while a cut is being encoded; `media_error
        {reqId, error}`; `live_tracks {roles, streaming}` when the set of live
        cameras changes; `clock {t0, carUtcMs}` answering `clock_sync`;
        `replay_state {state, atMs, speed, group?, groupStartUtcMs?,
        groupEndUtcMs?, roles, anchor?, error?}` with state `playing`,
        `paused`, `ended`, `live` (nothing sealed at that time, or the answer
        to `replay_stop`) or `error`. Bytes arrive as binary `MediaChunk` frames.

        RTP timestamps are car-clock ms × 90 mod 2^32 on every camera track;
        viewers unwrap them against the car clock. Live, that is the frame's
        capture time. Replayed, each seek / resume / speed change starts an
        epoch: a frame with RTP time r ≥ `anchor.fromRtpMs` was captured at
        `anchor.wallMs + (r − anchor.rtpMs) × anchor.speed` (`anchor.live`:
        at r itself).

        Downloads and cuts are progressive MP4 files. At most `maxTransfers`
        concurrent transfers per session; chunks ≤ `chunkMaxBytes`; senders
        respect `bufferedAmount` backpressure.
      properties:
        type:
          type: string
          enum: [dc_hello]
        v:
          type: integer
          enum: [1]
        sessionId:
          type: string
        features:
          type: array
          items:
            type: string
            enum: [live, replay, download, cut]
        cameras:
          type: array
          items:
            type: string
          description: Camera roles on this car, e.g. `front`, `right`, `rear`, `left`
        tracks:
          type: array
          items:
            type: string
          description: Camera roles with a live track in this session
        carUtcMs:
          type: integer
          format: int64
          description: Car wall clock when the hello was sent
        maxCutMs:
          type: integer
          example: 600000
          description: Longest `cut_request` range
        chunkMaxBytes:
          type: integer
          example: 262144
        maxTransfers:
          type: integer
          example: 2
    MediaChunk:
      type: string
      format: binary
      description: |
        Binary data-channel frame, big-endian:
        `u8 type (1=chunk) | u32 reqId | u32 seq | u8 flags | payload`.
        Flags: `0x01` eof (last chunk of the transfer). `seq` restarts at 0
        for each transfer. Payload ≤ `chunkMaxBytes`.
