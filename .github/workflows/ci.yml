name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest already ships an Android SDK. Avoid android-actions/setup-android:
      # its default still installs the obsolete `tools` package removed from sdkmanager.
      - name: Android SDK platform and NDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          SDKMANAGER=${SDKMANAGER:-$(command -v sdkmanager)}
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;$(grep '^oaa.ndkVersion=' gradle.properties | cut -d= -f2 | tr -d '\r')"

      # libs/oaartc (Pion via gomobile) downloads its own Go toolchain into ~/.gradle.
      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: ~/.gradle/oaa-toolchains
          key: oaa-toolchains-${{ hashFiles('gradle.properties', 'libs/oaartc/go.sum') }}

      - name: Required repository files
        run: |
          set -euo pipefail
          for f in libs/signing/community.pem libs/signing/community.pk8 NOTICE LICENSE \
            SECURITY.md CODE_OF_CONDUCT.md docs/disclaimer.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Version in sync
        run: python3 tools/sync-version --check

      # Unit tests (incl. ServiceLoader descriptors), Android lint, web typecheck/eslint/tests.
      - name: Gradle check + debug APK + hub jar
        run: ./gradlew check :app:assembleDebug :server:jar --stacktrace

      - name: Go tests (libs/oaartc)
        working-directory: libs/oaartc
        run: |
          set -euo pipefail
          go_version=$(grep '^oaa.goVersion=' ../../gradle.properties | cut -d= -f2 | tr -d '\r')
          GOTOOLCHAIN=local GOPATH="$HOME/.gradle/oaa-toolchains/gopath" \
            "$HOME/.gradle/oaa-toolchains/go$go_version/go/bin/go" test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Home Assistant integration tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q homeassistant/tests
