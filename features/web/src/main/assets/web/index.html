<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Open Automotive Assistant</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('oaa_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
      // Lock rem scale to the physical screen so the soft keyboard (shorter
      // layout viewport) does not rescale the whole UI via vmin.
      try {
        var w = Math.max(screen.width || 0, screen.availWidth || 0, window.innerWidth || 0);
        var h = Math.max(screen.height || 0, screen.availHeight || 0, window.innerHeight || 0);
        var vmin = Math.min(w, h) || 800;
        document.documentElement.style.setProperty('--oaa-vmin', vmin + 'px');
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/cards.css">
</head>
<body>
  <div id="iconSprite" hidden></div>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand">OAA</div>
      <div class="brand-car" id="sideCar" hidden></div>
      <div class="nav-list">
        <a class="nav-item" href="/fleet" data-page="fleet" data-role="hub"><span class="ico" data-icon="back"></span><span class="label">Fleet</span></a>
        <a class="nav-item active" href="/" data-page="home"><span class="ico" data-icon="home"></span><span class="label">Início</span></a>
        <a class="nav-item" href="/controls" data-page="controls"><span class="ico" data-icon="cabin"></span><span class="label">Controles</span></a>
        <a class="nav-item" href="/drive" data-page="drive"><span class="ico" data-icon="drive"></span><span class="label">Condução</span></a>
        <a class="nav-item" href="/energy" data-page="energy" data-cap="CHARGING,HYBRID_ENERGY"><span class="ico" data-icon="energy"></span><span class="label">Energia</span></a>
        <a class="nav-item" href="/lights" data-page="lights"><span class="ico" data-icon="light"></span><span class="label">Iluminação</span></a>
        <a class="nav-item" href="/adas" data-page="adas"><span class="ico" data-icon="adas"></span><span class="label">ADAS</span></a>
        <a class="nav-item" href="/assistant" data-page="assistant"><span class="ico" data-icon="assistant"></span><span class="label">Assistente</span></a>
        <a class="nav-item" href="/display" data-page="display"><span class="ico" data-icon="hud"></span><span class="label">Tela</span></a>
        <a class="nav-item" href="/sound" data-page="sound"><span class="ico" data-icon="sound"></span><span class="label">Som</span></a>
        <a class="nav-item" href="/connect" data-page="connect"><span class="ico" data-icon="system"></span><span class="label">Conexão</span></a>
        <a class="nav-item" href="/vehicle" data-page="vehicle"><span class="ico" data-icon="sensor"></span><span class="label">Meu Veículo</span></a>
        <a class="nav-item" href="/history" data-page="history"><span class="ico" data-icon="history"></span><span class="label">Histórico</span></a>
        <a class="nav-item" href="/cameras" data-page="cameras" data-cap="CAMERAS_DVR"><span class="ico" data-icon="camera"></span><span class="label">Câmeras</span></a>
        <a class="nav-item" href="/store" data-page="store"><span class="ico" data-icon="store"></span><span class="label">Loja</span></a>
        <a class="nav-item" href="/shortcuts" data-page="shortcuts"><span class="ico" data-icon="pin"></span><span class="label">Atalhos</span></a>
        <a class="nav-item" href="/plugins" data-page="plugins"><span class="ico" data-icon="plugins"></span><span class="label">Plugins</span></a>
        <a class="nav-item" href="/settings" data-page="settings"><span class="ico" data-icon="system"></span><span class="label">Ajustes</span></a>
        <a class="nav-item" href="/lab" data-page="lab"><span class="ico" data-icon="lab"></span><span class="label">Lab</span></a>
        <a class="nav-item" href="/about" data-page="about"><span class="ico" data-icon="about"></span><span class="label">Sobre</span></a>
      </div>
      <div class="ver" id="sideVer">v0.1</div>
    </nav>
    <main class="main" id="main"></main>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
